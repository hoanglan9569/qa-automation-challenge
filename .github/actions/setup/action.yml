name: Set up
description: Bun at the version package.json pins, the locked packages and, optionally, one Playwright browser.

inputs:
  browser:
    description: chromium, firefox or webkit, installed with the OS libraries it needs; empty for none.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # setup-bun unpacks Bun with unzip, which the Playwright image lacks (its jobs run as root).
    - name: Install unzip
      if: runner.os == 'Linux'
      shell: bash
      run: command -v unzip >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip; }
      env:
        DEBIAN_FRONTEND: noninteractive

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install packages
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install ${{ inputs.browser }}
      if: inputs.browser != ''
      shell: bash
      # Into the repo, where playwright.config.ts looks for it (as `bun run browsers` does).
      run: bunx playwright install --with-deps "$BROWSER"
      env:
        BROWSER: ${{ inputs.browser }}
        PLAYWRIGHT_BROWSERS_PATH: .tools/ms-playwright
