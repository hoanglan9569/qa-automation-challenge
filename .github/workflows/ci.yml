name: E2E, API & performance tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so a change on the live site is caught even when the repo is quiet.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment (env/.env.<name>)
        type: choice
        options: [staging, production]
        default: staging
      suite:
        description: Functional tests — regression is all of them, smoke the critical path
        type: choice
        options: [regression, smoke]
        default: regression
      perf_profile:
        description: Load profile of the performance tests
        type: choice
        options: [smoke, load]
        default: smoke

# On a pull request a newer push replaces the run in progress; on main every
# run finishes, one after the other, so each one publishes its report.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TEST_ENV: ${{ inputs.environment || 'staging' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: lint · types · format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check

  linux:
    name: ${{ matrix.project }} · linux
    runs-on: ubuntu-latest
    # Every browser and the OS libraries it needs come baked in. Keep the tag in
    # step with @playwright/test — Playwright names the image it wants if not.
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [api, chromium, firefox, webkit, mobile-chrome, mobile-safari]
    env:
      # Decrypts the demo account in env/.
      STRING_HEX_DEMOBLAZE: ${{ secrets.STRING_HEX_DEMOBLAZE }}
      # The container runs as root, and Firefox will not run as root with a $HOME owned by another user.
      HOME: /root
    steps: &test-steps
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browser: ${{ matrix.browser }}
      - name: Test
        run: bun --bun playwright test --project="$PROJECT" $GREP
        env:
          PROJECT: ${{ matrix.project }}
          GREP: ${{ inputs.suite == 'smoke' && '--grep=@smoke' || '' }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: ${{ matrix.project }}-${{ runner.os }}.zip
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.project }}-${{ runner.os }}
          path: blob-report/
          retention-days: 7

  # The other two desktop platforms. Job containers are Linux-only, so these
  # install their browser instead.
  desktop:
    name: ${{ matrix.project }} · ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium, os: windows-latest, platform: windows }
          - { project: webkit, browser: webkit, os: macos-latest, platform: macos }
    env:
      STRING_HEX_DEMOBLAZE: ${{ secrets.STRING_HEX_DEMOBLAZE }}
    steps: *test-steps

  perf:
    name: performance (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRING_HEX_DEMOBLAZE: ${{ secrets.STRING_HEX_DEMOBLAZE }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run k6:install
      - name: Test
        run: bun run perf
        env:
          PERF_PROFILE: ${{ inputs.perf_profile || 'smoke' }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: perf-Linux.zip
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-perf
          path: blob-report/
          retention-days: 7

  report:
    name: report
    needs: [linux, desktop, perf]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true
      # The main config doubles as the merge config: its testDir is what lets
      # blobs recorded on Linux, Windows and macOS merge into one report. The
      # JSON results ride along for the counts on the report history page.
      - name: Merge into one HTML report
        run: |
          bun --bun playwright merge-reports --config=playwright.config.ts --reporter=html,json all-blob-reports
          mv results.json playwright-report/
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: results.json
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Every run on main gets its own page: <site>/runs/<run number>/. The site
  # lives on the gh-pages branch, so earlier runs stay published.
  pages:
    name: publish report
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pushes the gh-pages branch
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}runs/${{ github.run_number }}/
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: report
      - name: Add this run to the report history
        run: |
          mkdir site
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth=1 origin gh-pages
            git archive FETCH_HEAD | tar -x -C site
          fi
          bun run scripts/report-history.ts site report
        env:
          SUITE: ${{ inputs.suite || 'regression' }}
          PERF_PROFILE: ${{ inputs.perf_profile || 'smoke' }}
      # A single commit, replaced every time, so reports pruned from the site
      # leave nothing behind in the repository.
      - name: Save the history to gh-pages
        working-directory: site
        run: |
          export GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE="$PWD" GIT_INDEX_FILE="$RUNNER_TEMP/gh-pages.index"
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git add -A
          commit=$(git commit-tree "$(git write-tree)" -m "Test reports up to run #$GITHUB_RUN_NUMBER")
          git push --force origin "$commit:refs/heads/gh-pages"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Link the report
        run: |
          echo "### [Report for run #$GITHUB_RUN_NUMBER](${PAGE_URL}runs/$GITHUB_RUN_NUMBER/) · [all runs]($PAGE_URL)" >> "$GITHUB_STEP_SUMMARY"
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
